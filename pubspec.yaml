name: assignmate
description: Offline-first assignment tracker for students

publish_to: 'none'

version: 0.3.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # 🧱 STORAGE (CORE)
  hive: 2.2.3
  hive_flutter: 1.1.0
  uuid: 4.4.0

  # 🔁 STATE MANAGEMENT (SIMPLE + SCALABLE)
  provider: 6.1.2

  # 📅 DATE & TIME
  intl: 0.19.0

  # 🎨 UI
  google_fonts: 6.2.1

  # NOTIFICATION
  flutter_local_notifications: 21.0.0
  timezone: ^0.11.0
  flutter_timezone: 5.0.2
  permission_handler: 11.3.1
  path_provider: ^2.1.5
  file_picker: ^11.0.2
  share_plus: ^12.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  # 🔧 CODE GENERATION (Hive)
  build_runner: ^2.4.13
  hive_generator: ^2.0.1
  change_app_package_name: ^1.1.0
  flutter_lints: 5.0.0

flutter:
  uses-material-design: true